# Full stack: docker compose up --build  →  http://localhost:4000
# Set JWT_SECRET first:  export JWT_SECRET=$(openssl rand -hex 32)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace
      POSTGRES_DB: syncspace
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace"]
      interval: 5s
      retries: 10
    # Caps keep a laptop cool; plenty for a demo.
    cpus: 0.5
    mem_limit: 256m

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://syncspace:syncspace@db:5432/syncspace
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      WEB_ORIGIN: http://localhost:4000
      COOKIE_SECURE: "false" # plain http on localhost; use "true" behind HTTPS
    ports:
      - "4000:4000"
    cpus: 1
    mem_limit: 512m

volumes:
  pgdata:
